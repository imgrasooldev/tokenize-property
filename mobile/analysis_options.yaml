include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - lib/l10n/gen/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # The app's strings come from ARB files; public API docs are kept for the domain layer.
    public_member_api_docs: false
    # Repository interfaces (ADR 0018) may have one method; they are the seam tests fake.
    one_member_abstracts: false
    lines_longer_than_80_chars: false
