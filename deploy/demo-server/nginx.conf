# Private IP demo server: port 80 -> Next.js on 127.0.0.1:3100. Plain HTTP by owner decision
# (no domain yet); add TLS before any real users or real data.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built assets are content-hashed: cache them hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so clients cannot spoof their address; the app trusts it only
        # with TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (live market feed) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
