# Private IP demo server: port 80 -> Next.js on 127.0.0.1:3100. Plain HTTP by owner decision
# (no domain yet); add TLS before any real users or real data.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Design mockups (static copy of docs/design, published by update.sh). Not indexed.
    location = /mockups { return 301 /mockups/; }
    location /mockups/ {
        alias /var/www/pt-mockups/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Platform guide (interactive HTML + PDF, docs/design/guide, published with the mockups).
    location = /docs { return 301 /docs/; }
    location /docs/ {
        alias /var/www/pt-mockups/guide/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Built assets are content-hashed: cache them hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sponsor document uploads (server action on /sponsor, up to 25 MB per file).
    location = /sponsor {
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Public API for the mobile app (ADR 0018): JSON only, small bodies, the client address set by the proxy.
    location /v1/ {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:4960;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so clients cannot spoof their address; the app trusts it only
        # with TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (live market feed) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
