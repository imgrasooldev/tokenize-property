name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Tests (unit, fuzz, invariant)
        run: forge test -vvv
      - name: Coverage
        run: forge coverage --report summary --no-match-coverage "(test|lib|vendor|script)"

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          slither-args: --filter-paths "lib/|test/|src/vendor/|script/" --exclude-dependencies
          fail-on: low

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pt_admin
          # Throw-away CI container only; not a real credential.
          POSTGRES_PASSWORD: ci_only_not_a_secret_0000
          POSTGRES_DB: property_token_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pt_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: 5433
      PG_ADMIN_USER: pt_admin
      PG_ADMIN_PASSWORD: ci_only_not_a_secret_0000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install (exact lockfile, no install scripts)
        run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Migrations apply cleanly
        run: npm run migrate -- --test
      - name: Tests
        run: npm test
      - uses: foundry-rs/foundry-toolchain@v1
      - name: ABIs match the contracts (no drift)
        run: |
          (cd ../contracts && forge build)
          npm run gen:abis
          git diff --exit-code -- packages/contracts/src/abis.ts
