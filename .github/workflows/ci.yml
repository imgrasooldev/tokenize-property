name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('contracts/foundry.toml') != '' }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Tests (unit, fuzz, invariant)
        run: forge test -vvv
      - name: Coverage
        run: forge coverage --report summary

  slither:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('contracts/foundry.toml') != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          fail-on: high
